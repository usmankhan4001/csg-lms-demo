# ==============================================================================
# CSG-LMS DOKPLOY STACK DEFINITION
# Optimized for Dokploy Compose UI, Hetzner Cloud VMs & Proxmox VPS
# ==============================================================================
services:
  # ── PostgreSQL 16 with PGVector ─────────────────────────────────────────────
  csg-postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnhouse}
      POSTGRES_USER: ${POSTGRES_USER:-learnhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnhouse} -d ${POSTGRES_DB:-learnhouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  # ── Redis 7.2 Alpine ────────────────────────────────────────────────────────
  csg-redis:
    image: redis:7.2-alpine
    restart: always
    command: >
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
        redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory 512mb --maxmemory-policy allkeys-lru;
      else
        redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG || exit 1;
        else
          redis-cli ping | grep PONG || exit 1;
        fi'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      LEARNHOUSE_ENV: production
      LEARNHOUSE_PORT: 9000
      WORKERS: ${WORKERS:-4}
      LEARNHOUSE_SQL_CONNECTION_STRING: postgresql+asyncpg://${POSTGRES_USER:-learnhouse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@csg-postgres:5432/${POSTGRES_DB:-learnhouse}
      LEARNHOUSE_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@csg-redis:6379/0
      LEARNHOUSE_REDIS_CONNECTION_STRING: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@csg-redis:6379/0
      LEARNHOUSE_DOMAIN: ${DOMAIN:-csginfotech.co}
      LEARNHOUSE_FRONTEND_DOMAIN: ${APP_DOMAIN:-lms-demo.csginfotech.co}
      LEARNHOUSE_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://lms-demo.csginfotech.co,https://demo-lms.csginfotech.co,https://learnhouse.csginfotech.co,https://api-demo.csginfotech.co,https://collab-demo.csginfotech.co,https://livekit-demo.csginfotech.co,http://localhost:3000}
      LEARNHOUSE_ALLOWED_REGEXP: ${ALLOWED_REGEXP:-^https?://([a-zA-Z0-9-]+\.)*csginfotech\.co(:\d+)?$}
      LEARNHOUSE_COOKIE_DOMAIN: .csginfotech.co
      LEARNHOUSE_COOKIE_DOMAIN_ALLOW_BROAD: "true"
      LEARNHOUSE_URL: ${APP_URL:-${LEARNHOUSE_URL:-https://${APP_DOMAIN:-lms-demo.csginfotech.co}}}
      LEARNHOUSE_AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY:?LEARNHOUSE_AUTH_JWT_SECRET_KEY must be set}
      AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY:?LEARNHOUSE_AUTH_JWT_SECRET_KEY must be set}
      COLLAB_INTERNAL_KEY: ${COLLAB_INTERNAL_KEY:?COLLAB_INTERNAL_KEY must be set}
      LEARNHOUSE_MEDIA_SECRET_KEY: ${LEARNHOUSE_MEDIA_SECRET_KEY:-}
      # AI Provider API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Storage
      # Defaults to s3api, NOT local. The previous `local` default combined with
      # an api service that mounts no volume meant every uploaded file -- course
      # media, submissions, avatars -- was destroyed on each redeploy, silently.
      LEARNHOUSE_STORAGE_TYPE: ${LEARNHOUSE_STORAGE_TYPE:-s3api}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:-}
      # Cloudflare R2 wants "auto"; MinIO requires path-style addressing.
      S3_REGION: ${S3_REGION:-auto}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-}
      # Resend / Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # .co, matching every other domain here. The .com default would not align
      # with SPF/DKIM for csginfotech.co and mail would fail authentication.
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-notifications@csginfotech.co}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CSG-LMS}
      # Sentry
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Tinybird Analytics (Pillar 2 / Admin Insights)
      LEARNHOUSE_TINYBIRD_API_URL: ${LEARNHOUSE_TINYBIRD_API_URL:-http://tinybird-mock:8080}
      LEARNHOUSE_TINYBIRD_INGEST_TOKEN: ${LEARNHOUSE_TINYBIRD_INGEST_TOKEN:-mock_ingest_token}
      LEARNHOUSE_TINYBIRD_READ_TOKEN: ${LEARNHOUSE_TINYBIRD_READ_TOKEN:-mock_read_token}
      # LiveKit Real-Time Video
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://${LIVEKIT_DOMAIN:-${LIVEKIT_HOSTNAME:-livekit-demo.csginfotech.co}}}
      LIVEKIT_INTERNAL_URL: ws://livekit:7880
      # NO DEFAULT VALUE -- compose refuses to start when unset.
      #
      # These previously fell back to credentials committed in this repository,
      # so anyone with read access could mint LiveKit room tokens. That is the
      # thing being fixed.
      #
      # ${VAR:?...} rather than bare ${VAR}: a bare reference resolves to an
      # EMPTY string, which is not "live classes disabled" -- it is a LiveKit
      # server that accepts any token and an API that signs with an empty
      # secret. Failing at compose-up is the only outcome that cannot be
      # mistaken for a working deployment. Set both in the Dokploy environment
      # to enable live classes.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
    depends_on:
      csg-postgres:
        condition: service_healthy
      csg-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      # 30s was not enough and it cost a deploy. This container runs Alembic
      # migrations BEFORE uvicorn binds a port, so the old budget (30s grace +
      # 4x15s = ~90s) could mark a container unhealthy while it was correctly
      # migrating -- and web/collab then refuse to start, because they depend on
      # api being healthy. That is exactly how the 2026-09-14 12:29 deploy left
      # the frontend down while the API itself was fine.
      start_period: 180s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  # ── arq Background Worker (scheduled jobs) ─────────────────────────────────
  #
  # Same image and environment as `api`, running arq instead of uvicorn. Without
  # this process NOTHING in WorkerSettings.cron_jobs ever fires: the weekly
  # parent digest, the hourly nurture advance, the 09:00 fee reminders, and --
  # the one that silently loses data -- the 15-minute drain that is the ONLY
  # thing delivering a quiet-hours notification. Without it every deferred
  # message is written as "queued" and never sent, while the API healthcheck
  # stays green because the API itself is genuinely fine.
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # The image ENTRYPOINT (docker-entrypoint.prod.sh) waits for Postgres/Redis,
    # runs `alembic upgrade head` and then `exec uvicorn ...`, ignoring CMD
    # entirely -- so it MUST be overridden here or this container would boot a
    # second API server and no worker. arq resolves from the image WORKDIR
    # (/app) and the venv on PATH, as documented in src/core/worker.py.
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec arq src.core.worker.WorkerSettings"]
    # Deliberately a full copy of the `api` environment rather than a subset:
    # the worker reads the same config -- LEARNHOUSE_REDIS_CONNECTION_STRING
    # for the arq queue, the SQL connection string for every job, RESEND and
    # the AI keys for digest/nurture mail. Keep the two blocks in sync.
    environment:
      LEARNHOUSE_ENV: production
      LEARNHOUSE_PORT: 9000
      WORKERS: ${WORKERS:-4}
      LEARNHOUSE_SQL_CONNECTION_STRING: postgresql+asyncpg://${POSTGRES_USER:-learnhouse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@csg-postgres:5432/${POSTGRES_DB:-learnhouse}
      LEARNHOUSE_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@csg-redis:6379/0
      LEARNHOUSE_REDIS_CONNECTION_STRING: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@csg-redis:6379/0
      LEARNHOUSE_DOMAIN: ${DOMAIN:-csginfotech.co}
      LEARNHOUSE_FRONTEND_DOMAIN: ${APP_DOMAIN:-lms-demo.csginfotech.co}
      LEARNHOUSE_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://lms-demo.csginfotech.co,https://demo-lms.csginfotech.co,https://learnhouse.csginfotech.co,https://api-demo.csginfotech.co,https://collab-demo.csginfotech.co,https://livekit-demo.csginfotech.co,http://localhost:3000}
      LEARNHOUSE_ALLOWED_REGEXP: ${ALLOWED_REGEXP:-^https?://([a-zA-Z0-9-]+\.)*csginfotech\.co(:\d+)?$}
      LEARNHOUSE_COOKIE_DOMAIN: .csginfotech.co
      LEARNHOUSE_COOKIE_DOMAIN_ALLOW_BROAD: "true"
      LEARNHOUSE_URL: ${APP_URL:-${LEARNHOUSE_URL:-https://${APP_DOMAIN:-lms-demo.csginfotech.co}}}
      LEARNHOUSE_AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY:?LEARNHOUSE_AUTH_JWT_SECRET_KEY must be set}
      AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY:?LEARNHOUSE_AUTH_JWT_SECRET_KEY must be set}
      COLLAB_INTERNAL_KEY: ${COLLAB_INTERNAL_KEY:?COLLAB_INTERNAL_KEY must be set}
      LEARNHOUSE_MEDIA_SECRET_KEY: ${LEARNHOUSE_MEDIA_SECRET_KEY:-}
      # AI Provider API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Storage
      LEARNHOUSE_STORAGE_TYPE: ${LEARNHOUSE_STORAGE_TYPE:-s3api}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-}
      # Resend / Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-notifications@csginfotech.co}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CSG-LMS}
      # Sentry
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Tinybird Analytics (Pillar 2 / Admin Insights)
      LEARNHOUSE_TINYBIRD_API_URL: ${LEARNHOUSE_TINYBIRD_API_URL:-http://tinybird-mock:8080}
      LEARNHOUSE_TINYBIRD_INGEST_TOKEN: ${LEARNHOUSE_TINYBIRD_INGEST_TOKEN:-mock_ingest_token}
      LEARNHOUSE_TINYBIRD_READ_TOKEN: ${LEARNHOUSE_TINYBIRD_READ_TOKEN:-mock_read_token}
      # LiveKit Real-Time Video
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://${LIVEKIT_DOMAIN:-${LIVEKIT_HOSTNAME:-livekit-demo.csginfotech.co}}}
      LIVEKIT_INTERNAL_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
    depends_on:
      csg-postgres:
        condition: service_healthy
      csg-redis:
        condition: service_healthy
    # Process liveness ONLY -- deliberately not the API's /api/v1/health. The
    # worker serves no HTTP, so an HTTP probe would either fail forever or,
    # worse, report on the API while the worker is dead. This proves the arq
    # process is alive; it does NOT prove jobs are running. The real signal is
    # the hourly "arq worker healthcheck tick" log line -- alert on its ABSENCE.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'arq src.core.worker.WorkerSettings' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ── LiveKit Real-Time Video (WebRTC) ────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:v1.9.1
    restart: always
    environment:
      # Now a full YAML config rather than the LIVEKIT_KEYS shorthand, because
      # Egress needs two blocks that shorthand cannot express:
      #   * `redis` -- livekit-server hands every StartRoomCompositeEgress to an
      #     egress worker over the psrpc Redis bus. With no Redis here the API's
      #     dispatch fails with "no response from egress service" and every
      #     recording stays PENDING forever.
      #   * `webhook` -- the only way room_started / egress_ended ever reach
      #     POST /api/v1/live/webhooks, which is what drives the recording
      #     lifecycle. Same target as docker-compose.prod.yml.
      # Same reasoning as the api service above: no committed fallback.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          port_range_start: 50200
          port_range_end: 50250
          use_external_ip: true
        redis:
          address: csg-redis:6379
          password: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
        keys:
          ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
        webhook:
          api_key: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}
          urls:
            - http://api:9000/api/v1/live/webhooks
    ports:
      - "7883:7880"
      - "50200-50250:50200-50250/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ── LiveKit Egress (Composite Class Recording) ──────────────────────────────
  # The recorder `sms_live_class_detail.recording_*` was modelled for but never
  # had. It is a separate process from livekit-server on purpose: it runs
  # headless Chromium + GStreamer, which is far too heavy to share the SFU's
  # memory budget, and it scales independently (N recorders per SFU).
  livekit-egress:
    image: livekit/egress:v1.9.1
    restart: always
    environment:
      # The image takes its whole YAML config in this one env var (the
      # alternative, EGRESS_CONFIG_FILE, needs a mounted volume -- see the
      # livekit/egress README). `ws_url` is the CONTAINER-INTERNAL address,
      # the same split as LIVEKIT_INTERNAL_URL on the api service: "localhost"
      # here would mean the egress container itself.
      # `redis` MUST be the same Redis as livekit-server above -- that bus is
      # how the server reaches this worker.
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}
        api_secret: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
        ws_url: ws://livekit:7880
        redis:
          address: csg-redis:6379
          password: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
        health_port: 8080
        logging:
          level: info
    # Headless Chromium needs more /dev/shm than Docker's 64MB default or it
    # dies mid-recording with a crash that looks like an egress failure.
    shm_size: 1gb
    depends_on:
      livekit:
        condition: service_healthy
      csg-redis:
        condition: service_healthy
    healthcheck:
      # The health handler answers on ANY path with the service status JSON.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks:
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  # ── Hocuspocus Real-Time Collab ─────────────────────────────────────────────
  collab:
    build:
      context: ./apps/collab
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      NODE_ENV: production
      COLLAB_PORT: 4000
      LEARNHOUSE_API_URL: http://api:9000
      LEARNHOUSE_AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY:?LEARNHOUSE_AUTH_JWT_SECRET_KEY must be set}
      COLLAB_INTERNAL_KEY: ${COLLAB_INTERNAL_KEY:?COLLAB_INTERNAL_KEY must be set}
      LEARNHOUSE_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@csg-redis:6379/0
      COLLAB_TRUST_PROXY: "true"
    depends_on:
      api:
        condition: service_healthy
      csg-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ── Tinybird Mock Analytics ─────────────────────────────────────────────────
  tinybird-mock:
    build:
      context: ./deploy/tinybird-mock
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ── Next.js 15 Standalone Web ───────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${APP_URL:-${LEARNHOUSE_URL:-https://${APP_DOMAIN:-lms-demo.csginfotech.co}}}
      NEXT_PUBLIC_LEARNHOUSE_API_URL: ${LEARNHOUSE_API_URL:-https://${API_DOMAIN:-api-demo.csginfotech.co}/api/v1/}
      # PUBLIC url, not the internal one. NEXT_PUBLIC_* is shipped to the
      # BROWSER, and a browser cannot resolve the Docker service hostname
      # `api` -- nor load http:// from an https:// page, which Chrome blocks
      # as mixed content before the request is even made. The old
      # `http://api:9000` default therefore made every client-side fetch throw,
      # and api-client.ts maps a thrown fetch to the Offline state: every
      # module in the dashboard rendered "You're offline" while the API was
      # perfectly healthy. Server-side rendering uses LEARNHOUSE_INTERNAL_API_URL
      # for the internal hop; this one must stay publicly resolvable.
      NEXT_PUBLIC_LEARNHOUSE_BACKEND_URL: ${LEARNHOUSE_BACKEND_URL:-https://${API_DOMAIN:-api-demo.csginfotech.co}}
      LEARNHOUSE_INTERNAL_API_URL: http://api:9000
      NEXT_PUBLIC_LEARNHOUSE_DOMAIN: ${APP_DOMAIN:-lms-demo.csginfotech.co}
      NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN: ${TOP_DOMAIN:-csginfotech.co}
      NEXT_PUBLIC_LEARNHOUSE_HTTPS: "true"
      NEXT_PUBLIC_LEARNHOUSE_COLLAB_URL: ${LEARNHOUSE_COLLAB_URL:-wss://${COLLAB_DOMAIN:-collab-demo.csginfotech.co}}
      NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_URL:-https://${KEYCLOAK_DOMAIN:-auth-demo.csginfotech.co}}
      NEXT_PUBLIC_KEYCLOAK_REALM: csg-lms
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: csg-lms-web
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 25s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

# ── Volumes & Dokploy Network ─────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

networks:
  dokploy-network:
    external: true
  csg-internal:
    driver: bridge
