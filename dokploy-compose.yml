# ==============================================================================
# CSG-LMS DOKPLOY STACK DEFINITION
# Optimized for Dokploy Compose UI, Hetzner Cloud VMs & Proxmox VPS
# ==============================================================================
services:
  # ── PostgreSQL 16 with PGVector ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnhouse}
      POSTGRES_USER: ${POSTGRES_USER:-learnhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnhouse} -d ${POSTGRES_DB:-learnhouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  # ── Redis 7.2 Alpine ────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: always
    command: >
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
        redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory 512mb --maxmemory-policy allkeys-lru;
      else
        redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG || exit 1;
        else
          redis-cli ping | grep PONG || exit 1;
        fi'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ── Keycloak 24/26 OIDC IAM ────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    restart: always
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-learnhouse}
      KC_DB_USERNAME: ${POSTGRES_USER:-learnhouse}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-auth.csginfotech.com}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_HOSTNAME:-auth.csginfotech.com}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./deploy/keycloak/realm-export-csg-lms.json:/opt/keycloak/data/import/realm-export-csg-lms.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s
    networks:
      - dokploy-network
      - csg-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.csg-auth.rule=Host(`${KEYCLOAK_HOSTNAME:-auth.csginfotech.com}`)"
      - "traefik.http.routers.csg-auth.entrypoints=websecure"
      - "traefik.http.routers.csg-auth.tls=true"
      - "traefik.http.routers.csg-auth.tls.certresolver=letsencrypt"
      - "traefik.http.services.csg-auth.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.csg-auth-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.csg-auth.middlewares=csg-auth-headers"
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      LEARNHOUSE_ENV: production
      LEARNHOUSE_PORT: 9000
      WORKERS: ${WORKERS:-4}
      LEARNHOUSE_SQL_CONNECTION_STRING: postgresql+asyncpg://${POSTGRES_USER:-learnhouse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-learnhouse}
      LEARNHOUSE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LEARNHOUSE_REDIS_CONNECTION_STRING: redis://:${REDIS_PASSWORD}@redis:6379/0
      LEARNHOUSE_URL: ${LEARNHOUSE_URL:-https://app.csginfotech.com}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.csginfotech.com}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: csg-lms
      KEYCLOAK_CLIENT_ID: csg-lms-api
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/csg-lms/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${KEYCLOAK_URL:-https://auth.csginfotech.com}/realms/csg-lms
      KEYCLOAK_VERIFY_SIGNATURE: "true"
      LEARNHOUSE_AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY}
      AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY}
      COLLAB_INTERNAL_KEY: ${COLLAB_INTERNAL_KEY}
      LEARNHOUSE_MEDIA_SECRET_KEY: ${LEARNHOUSE_MEDIA_SECRET_KEY}
      # AI Provider API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Storage
      LEARNHOUSE_STORAGE_TYPE: ${LEARNHOUSE_STORAGE_TYPE:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:-}
      # Resend / Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-notifications@csginfotech.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CSG-LMS}
      # Sentry
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks:
      - dokploy-network
      - csg-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.csg-api.rule=Host(`${API_HOSTNAME:-api.csginfotech.com}`)"
      - "traefik.http.routers.csg-api.entrypoints=websecure"
      - "traefik.http.routers.csg-api.tls=true"
      - "traefik.http.routers.csg-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.csg-api.loadbalancer.server.port=9000"
      - "traefik.http.middlewares.csg-api-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.csg-api.middlewares=csg-api-headers"
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  # ── Hocuspocus Real-Time Collab ─────────────────────────────────────────────
  collab:
    build:
      context: ./apps/collab
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      NODE_ENV: production
      COLLAB_PORT: 4000
      LEARNHOUSE_API_URL: http://api:9000
      LEARNHOUSE_AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY}
      COLLAB_INTERNAL_KEY: ${COLLAB_INTERNAL_KEY}
      LEARNHOUSE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      COLLAB_TRUST_PROXY: "true"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - dokploy-network
      - csg-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.csg-collab.rule=Host(`${COLLAB_HOSTNAME:-collab.csginfotech.com}`)"
      - "traefik.http.routers.csg-collab.entrypoints=websecure"
      - "traefik.http.routers.csg-collab.tls=true"
      - "traefik.http.routers.csg-collab.tls.certresolver=letsencrypt"
      - "traefik.http.services.csg-collab.loadbalancer.server.port=4000"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ── Next.js 15 Standalone Web ───────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${LEARNHOUSE_URL:-https://app.csginfotech.com}
      NEXT_PUBLIC_LEARNHOUSE_API_URL: ${LEARNHOUSE_API_URL:-https://api.csginfotech.com}
      NEXT_PUBLIC_LEARNHOUSE_COLLAB_URL: ${LEARNHOUSE_COLLAB_URL:-wss://collab.csginfotech.com}
      NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.csginfotech.com}
      NEXT_PUBLIC_KEYCLOAK_REALM: csg-lms
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: csg-lms-web
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 25s
    networks:
      - dokploy-network
      - csg-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.csg-web.rule=Host(`${APP_HOSTNAME:-app.csginfotech.com}`)"
      - "traefik.http.routers.csg-web.entrypoints=websecure"
      - "traefik.http.routers.csg-web.tls=true"
      - "traefik.http.routers.csg-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.csg-web.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

# ── Volumes & Dokploy Network ─────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

networks:
  dokploy-network:
    external: true
  csg-internal:
    driver: bridge
