# ==============================================================================
# CSG-LMS DOKPLOY STACK DEFINITION
# Optimized for Dokploy Compose UI, Hetzner Cloud VMs & Proxmox VPS
# ==============================================================================
services:
  # ── PostgreSQL 16 with PGVector ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnhouse}
      POSTGRES_USER: ${POSTGRES_USER:-learnhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnhouse} -d ${POSTGRES_DB:-learnhouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  # ── Redis 7.2 Alpine ────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: always
    command: >
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
        redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory 512mb --maxmemory-policy allkeys-lru;
      else
        redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG || exit 1;
        else
          redis-cli ping | grep PONG || exit 1;
        fi'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      LEARNHOUSE_ENV: production
      LEARNHOUSE_PORT: 9000
      WORKERS: ${WORKERS:-4}
      LEARNHOUSE_SQL_CONNECTION_STRING: postgresql+asyncpg://${POSTGRES_USER:-learnhouse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-learnhouse}
      LEARNHOUSE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LEARNHOUSE_REDIS_CONNECTION_STRING: redis://:${REDIS_PASSWORD}@redis:6379/0
      LEARNHOUSE_DOMAIN: ${DOMAIN:-csginfotech.co}
      LEARNHOUSE_FRONTEND_DOMAIN: ${APP_DOMAIN:-lms-demo.csginfotech.co}
      LEARNHOUSE_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://lms-demo.csginfotech.co,https://demo-lms.csginfotech.co,https://learnhouse.csginfotech.co,https://api-demo.csginfotech.co,https://collab-demo.csginfotech.co,https://livekit-demo.csginfotech.co,http://localhost:3000}
      LEARNHOUSE_ALLOWED_REGEXP: ${ALLOWED_REGEXP:-^https?://([a-zA-Z0-9-]+\.)*csginfotech\.co(:\d+)?$}
      LEARNHOUSE_COOKIE_DOMAIN: .csginfotech.co
      LEARNHOUSE_COOKIE_DOMAIN_ALLOW_BROAD: "true"
      LEARNHOUSE_URL: ${APP_URL:-${LEARNHOUSE_URL:-https://${APP_DOMAIN:-lms-demo.csginfotech.co}}}
      LEARNHOUSE_AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY}
      AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY}
      COLLAB_INTERNAL_KEY: ${COLLAB_INTERNAL_KEY}
      LEARNHOUSE_MEDIA_SECRET_KEY: ${LEARNHOUSE_MEDIA_SECRET_KEY}
      # AI Provider API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Storage
      LEARNHOUSE_STORAGE_TYPE: ${LEARNHOUSE_STORAGE_TYPE:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:-}
      # Resend / Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-notifications@csginfotech.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CSG-LMS}
      # Sentry
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Tinybird Analytics (Pillar 2 / Admin Insights)
      LEARNHOUSE_TINYBIRD_API_URL: ${LEARNHOUSE_TINYBIRD_API_URL:-http://tinybird-mock:8080}
      LEARNHOUSE_TINYBIRD_INGEST_TOKEN: ${LEARNHOUSE_TINYBIRD_INGEST_TOKEN:-mock_ingest_token}
      LEARNHOUSE_TINYBIRD_READ_TOKEN: ${LEARNHOUSE_TINYBIRD_READ_TOKEN:-mock_read_token}
      # LiveKit Real-Time Video
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://${LIVEKIT_DOMAIN:-${LIVEKIT_HOSTNAME:-livekit-demo.csginfotech.co}}}
      LIVEKIT_INTERNAL_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-csg_livekit_key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-csg_livekit_secret_minimum_32_chars_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  # ── LiveKit Real-Time Video (WebRTC) ────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:v1.9.1
    restart: always
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-csg_livekit_key}: ${LIVEKIT_API_SECRET:-csg_livekit_secret_minimum_32_chars_2026}"
    ports:
      - "7883:7880"
      - "50200-50250:50200-50250/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ── Hocuspocus Real-Time Collab ─────────────────────────────────────────────
  collab:
    build:
      context: ./apps/collab
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      NODE_ENV: production
      COLLAB_PORT: 4000
      LEARNHOUSE_API_URL: http://api:9000
      LEARNHOUSE_AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY}
      COLLAB_INTERNAL_KEY: ${COLLAB_INTERNAL_KEY}
      LEARNHOUSE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      COLLAB_TRUST_PROXY: "true"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ── Tinybird Mock Analytics ─────────────────────────────────────────────────
  tinybird-mock:
    build:
      context: ./deploy/tinybird-mock
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ── Next.js 15 Standalone Web ───────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${APP_URL:-${LEARNHOUSE_URL:-https://${APP_DOMAIN:-lms-demo.csginfotech.co}}}
      NEXT_PUBLIC_LEARNHOUSE_API_URL: ${LEARNHOUSE_API_URL:-https://${API_DOMAIN:-api-demo.csginfotech.co}/api/v1/}
      NEXT_PUBLIC_LEARNHOUSE_BACKEND_URL: ${LEARNHOUSE_BACKEND_URL:-http://api:9000}
      LEARNHOUSE_INTERNAL_API_URL: http://api:9000
      NEXT_PUBLIC_LEARNHOUSE_DOMAIN: ${APP_DOMAIN:-lms-demo.csginfotech.co}
      NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN: ${TOP_DOMAIN:-csginfotech.co}
      NEXT_PUBLIC_LEARNHOUSE_HTTPS: "true"
      NEXT_PUBLIC_LEARNHOUSE_COLLAB_URL: ${LEARNHOUSE_COLLAB_URL:-wss://${COLLAB_DOMAIN:-collab-demo.csginfotech.co}}
      NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_URL:-https://${KEYCLOAK_DOMAIN:-auth-demo.csginfotech.co}}
      NEXT_PUBLIC_KEYCLOAK_REALM: csg-lms
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: csg-lms-web
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 25s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

# ── Volumes & Dokploy Network ─────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

networks:
  dokploy-network:
    external: true
  csg-internal:
    driver: bridge
