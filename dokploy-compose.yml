# ==============================================================================
# CSG-LMS DOKPLOY STACK DEFINITION
# Optimized for Dokploy Compose UI, Hetzner Cloud VMs & Proxmox VPS
# ==============================================================================
services:
  # ── PostgreSQL 16 with PGVector ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnhouse}
      POSTGRES_USER: ${POSTGRES_USER:-learnhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnhouse} -d ${POSTGRES_DB:-learnhouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  # ── Redis 7.2 Alpine ────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: always
    command: >
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
        redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory 512mb --maxmemory-policy allkeys-lru;
      else
        redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG || exit 1;
        else
          redis-cli ping | grep PONG || exit 1;
        fi'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ── Keycloak 24/26 OIDC IAM ────────────────────────────────────────────────
  # ---------------------------------------------------------------------------
  # KEYCLOAK -- CANDIDATE FOR REMOVAL. NOTHING AUTHENTICATES AGAINST IT.
  #
  # `get_current_user_principal` (apps/api/src/core/keycloak_auth.py:469) now
  # depends on `get_authenticated_user` -- a real Learnhouse session -- and
  # builds the principal from the user's SMSUserRole grants. Its own docstring
  # states the token-decoding path is "left in place below but unreferenced ...
  # dormant insurance for a possible future real-Keycloak cutover".
  #
  # So this service costs a container, a database connection and a
  # Traefik-exposed admin console at ${KEYCLOAK_HOSTNAME}, for no function.
  # An exposed identity-provider admin surface that nothing uses is a
  # liability, not a spare part.
  #
  # NOT REMOVED HERE, deliberately -- deleting a service from a deploy file is
  # the owner's call, and note the API `depends_on` it with
  # `condition: service_healthy` (see the api service below), so Keycloak
  # failing currently blocks the entire API from starting for no reason.
  #
  # To remove it: delete this service block, the `keycloak` entry under the
  # api service's `depends_on`, and the KEYCLOAK_* variables in the api and
  # web environments. Keep KEYCLOAK_* only if a real cutover is planned.
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    restart: always
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-learnhouse}
      KC_DB_USERNAME: ${POSTGRES_USER:-learnhouse}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-auth.csginfotech.com}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_HOSTNAME:-auth.csginfotech.com}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./deploy/keycloak/realm-export-csg-lms.json:/opt/keycloak/data/import/realm-export-csg-lms.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s
    networks:
      - dokploy-network
      - csg-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.csg-auth.rule=Host(`${KEYCLOAK_DOMAIN:-${KEYCLOAK_HOSTNAME:-auth-demo.csginfotech.co}}`)"
      - "traefik.http.routers.csg-auth.entrypoints=websecure"
      - "traefik.http.routers.csg-auth.tls=true"
      - "traefik.http.routers.csg-auth.tls.certresolver=letsencrypt"
      - "traefik.http.services.csg-auth.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.csg-auth-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.csg-auth.middlewares=csg-auth-headers"
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      LEARNHOUSE_ENV: production
      LEARNHOUSE_PORT: 9000
      WORKERS: ${WORKERS:-4}
      LEARNHOUSE_SQL_CONNECTION_STRING: postgresql+asyncpg://${POSTGRES_USER:-learnhouse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-learnhouse}
      LEARNHOUSE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LEARNHOUSE_REDIS_CONNECTION_STRING: redis://:${REDIS_PASSWORD}@redis:6379/0
      LEARNHOUSE_URL: ${APP_URL:-${LEARNHOUSE_URL:-https://${APP_DOMAIN:-lms-demo.csginfotech.co}}}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://${KEYCLOAK_DOMAIN:-auth-demo.csginfotech.co}}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: csg-lms
      KEYCLOAK_CLIENT_ID: csg-lms-api
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/csg-lms/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${KEYCLOAK_URL:-https://${KEYCLOAK_DOMAIN:-auth-demo.csginfotech.co}}/realms/csg-lms
      KEYCLOAK_VERIFY_SIGNATURE: "true"
      LEARNHOUSE_AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY}
      AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY}
      COLLAB_INTERNAL_KEY: ${COLLAB_INTERNAL_KEY}
      LEARNHOUSE_MEDIA_SECRET_KEY: ${LEARNHOUSE_MEDIA_SECRET_KEY}
      # AI Provider API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Storage
      LEARNHOUSE_STORAGE_TYPE: ${LEARNHOUSE_STORAGE_TYPE:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:-}
      # Resend / Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-notifications@csginfotech.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CSG-LMS}
      # Sentry
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Tinybird Analytics (Pillar 2 / Admin Insights)
      # Defaults to local tinybird-mock service if unset.
      LEARNHOUSE_TINYBIRD_API_URL: ${LEARNHOUSE_TINYBIRD_API_URL:-http://tinybird-mock:8080}
      LEARNHOUSE_TINYBIRD_INGEST_TOKEN: ${LEARNHOUSE_TINYBIRD_INGEST_TOKEN:-mock_ingest_token}
      LEARNHOUSE_TINYBIRD_READ_TOKEN: ${LEARNHOUSE_TINYBIRD_READ_TOKEN:-mock_read_token}
      # LiveKit Real-Time Video
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://${LIVEKIT_DOMAIN:-${LIVEKIT_HOSTNAME:-livekit-demo.csginfotech.co}}}
      LIVEKIT_INTERNAL_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks:
      - dokploy-network
      - csg-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.csg-api.rule=Host(`${API_DOMAIN:-${API_HOSTNAME:-api-demo.csginfotech.co}}`)"
      - "traefik.http.routers.csg-api.entrypoints=websecure"
      - "traefik.http.routers.csg-api.tls=true"
      - "traefik.http.routers.csg-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.csg-api.loadbalancer.server.port=9000"
      - "traefik.http.middlewares.csg-api-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.csg-api.middlewares=csg-api-headers"
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  # ── LiveKit Real-Time Video (WebRTC) ────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:v1.9.1
    restart: always
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7883
          port_range_start: 50200
          port_range_end: 50250
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://api:9000/api/v1/live/webhooks
    ports:
      - "7883:7883"
      - "50200-50250:50200-50250/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    networks:
      - dokploy-network
      - csg-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.csg-livekit.rule=Host(`${LIVEKIT_DOMAIN:-${LIVEKIT_HOSTNAME:-livekit-demo.csginfotech.co}}`)"
      - "traefik.http.routers.csg-livekit.entrypoints=websecure"
      - "traefik.http.routers.csg-livekit.tls=true"
      - "traefik.http.routers.csg-livekit.tls.certresolver=letsencrypt"
      - "traefik.http.services.csg-livekit.loadbalancer.server.port=7880"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ── Hocuspocus Real-Time Collab ─────────────────────────────────────────────
  collab:
    build:
      context: ./apps/collab
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      NODE_ENV: production
      COLLAB_PORT: 4000
      LEARNHOUSE_API_URL: http://api:9000
      LEARNHOUSE_AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY}
      COLLAB_INTERNAL_KEY: ${COLLAB_INTERNAL_KEY}
      LEARNHOUSE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      COLLAB_TRUST_PROXY: "true"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - dokploy-network
      - csg-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.csg-collab.rule=Host(`${COLLAB_DOMAIN:-${COLLAB_HOSTNAME:-collab-demo.csginfotech.co}}`)"
      - "traefik.http.routers.csg-collab.entrypoints=websecure"
      - "traefik.http.routers.csg-collab.tls=true"
      - "traefik.http.routers.csg-collab.tls.certresolver=letsencrypt"
      - "traefik.http.services.csg-collab.loadbalancer.server.port=4000"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ── Tinybird Mock Analytics ─────────────────────────────────────────────────
  tinybird-mock:
    build:
      context: ./deploy/tinybird-mock
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - dokploy-network
      - csg-internal
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ── Next.js 15 Standalone Web ───────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${APP_URL:-${LEARNHOUSE_URL:-https://${APP_DOMAIN:-lms-demo.csginfotech.co}}}
      NEXT_PUBLIC_LEARNHOUSE_API_URL: ${LEARNHOUSE_API_URL:-https://${API_DOMAIN:-api-demo.csginfotech.co}}
      NEXT_PUBLIC_LEARNHOUSE_COLLAB_URL: ${LEARNHOUSE_COLLAB_URL:-wss://${COLLAB_DOMAIN:-collab-demo.csginfotech.co}}
      NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_URL:-https://${KEYCLOAK_DOMAIN:-auth-demo.csginfotech.co}}
      NEXT_PUBLIC_KEYCLOAK_REALM: csg-lms
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: csg-lms-web
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 25s
    networks:
      - dokploy-network
      - csg-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.csg-web.rule=Host(`${APP_DOMAIN:-${APP_HOSTNAME:-lms-demo.csginfotech.co}}`)"
      - "traefik.http.routers.csg-web.entrypoints=websecure"
      - "traefik.http.routers.csg-web.tls=true"
      - "traefik.http.routers.csg-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.csg-web.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

# ── Volumes & Dokploy Network ─────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

networks:
  dokploy-network:
    external: true
  csg-internal:
    driver: bridge
